name: TERRAFORM STACK

on:
  workflow_call:
    inputs:
      github_runner:
        description: 'Name of GitHub-hosted runner or self-hosted runner'
        # CodeBuild hosted ephemeral runner in pc-core-platform-tooling, rather than a GitHub
        # hosted one. Self hosted runners are not metered, so this keeps CI running when the
        # organisation's GitHub Actions minutes are exhausted, which is what prompted it.
        #
        # The run id and attempt are what make each runner ephemeral: CodeBuild matches the label
        # and starts one container for that job alone. A label without them is never dispatched.
        # Expressions work here because a workflow_call default is evaluated in the caller's
        # context, the same way concurrency_group below already relies on.
        #
        # Override this to 'ubuntu-latest' to go back to a GitHub hosted runner for one caller.
        default: 'ubuntu-latest'
        required: false
        type: string
      use_opentofu:
        description: 'Use OpenTofu instead of Terraform'
        default: true
        required: false
        type: boolean
      enable_terraform_execution:
        description: 'Enable terraform plan on pull requests and apply on push to default branch'
        default: false
        required: false
        type: boolean
      apply_requires_dispatch:
        description: >-
          Put a human between the merge and the apply. With this on, a push to the default branch runs a plan
          instead of an apply, and the apply only runs when the workflow is started by hand from the Actions tab
          on that branch. The plan lands in the run summary, so the person starting the apply has already seen
          what it will do.

          For private repositories on GitHub Free this is the only manual gate there is. Environment protection
          rules are a paid feature: the API rejects required reviewers with "Please ensure the billing plan
          supports the required reviewers protection rule", and an environment created without them looks like a
          gate while approving nothing.

          Callers that leave this off are unaffected: push to the default branch still applies, and
          workflow_dispatch is still skipped.
        default: false
        required: false
        type: boolean
      aws_default_region:
        description: 'Default AWS region to use for terraform execution (requires "enable_terraform_execution" to be true)'
        default: 'eu-central-2'
        required: false
        type: string
      aws_oidc_role_arn:
        description: 'AWS OIDC role ARN to assume for terraform execution (requires "enable_terraform_execution" to be true)'
        default: ''
        required: false
        type: string
      terraform_version:
        description: 'Terraform version used in github action'
        required: true
        type: string
      terraform_working_directory:
        description: 'A relative path starting with "." that Terraform will execute within (e.g. "./infrastructure")'
        default: '.'
        required: false
        type: string
      terraform_registry_hostname:
        description: 'Hostname of Terraform module registry (public or private). If using a private registry, ensure that the "TERRAFORM_REGISTRY_TOKEN" secret is set.'
        default: 'app.terraform.io'
        required: false
        type: string
      tflint_repo:
        description: 'Public repo where tflint config is stored'
        default: 'nuvibit/github-tflint-config'
        required: false
        type: string
      tflint_repo_config_path:
        description: 'Path to tflint config in tflint_repo'
        default: 'aws/.tflint.hcl'
        required: false
        type: string
      tflint_repo_ref:
        description: 'Ref or branch of tflint_repo'
        default: 'main'
        required: false
        type: string
      tflint_version:
        description: 'Tflint version to use in github action'
        default: 'latest'
        required: false
        type: string
      concurrency_group:
        description: 'Name of concurrency group to manage concurrent github action runs'
        default: ${{ github.repository }}/${{ github.event.pull_request.head.ref || github.ref }}/${{ inputs.terraform_working_directory }}
        required: false
        type: string
      default_branch:
        description: 'Default branch name for terraform apply (e.g. main, master)'
        default: 'main'
        required: false
        type: string
      aws_oidc_role_duration_seconds:
        description: 'Duration in seconds for assuming the AWS OIDC role (requires "enable"_terraform_execution" to be true)'
        default: 900 # 15 minutes
        required: false
        type: number
      enable_ecr_oci_modules:
        description: 'Enable ECR authentication for OCI modules. Set to true if using OCI modules from ECR'
        default: false
        required: false
        type: boolean
      ecr_oci_registry_ids:
        description: 'Comma-separated list of ECR registry IDs to authenticate with (e.g., "031244176730,123456789012")'
        default: ''
        required: false
        type: string
      aws_oidc_role_from_secret:
        description: 'Set true when the role ARN is supplied through the AWS_OIDC_ROLE_ARN secret instead of the aws_oidc_role_arn input. A secret cannot be tested in a step condition, so without this the AWS steps have no way to know a role was given and skip themselves.'
        default: false
        required: false
        type: boolean
    secrets:
      # GitHub App credentials to use instead of default GITHUB_TOKEN to avoid not triggering workflow runs on commit
      GH_APP_ID:
        required: false
      GH_APP_PRIVATE_KEY:
        required: false
      # (optional) Token for accessing private Terraform module registry (requires 'terraform_registry_hostname' to be set to a private registry)
      TERRAFORM_REGISTRY_TOKEN:
        required: false
      MODULE_REPOS:
        required: false
      # (optional) Role ARN to assume via OIDC, as an alternative to the 'aws_oidc_role_arn' input.
      #
      # Both exist because a caller cannot always use the input. The contexts allowed in
      # 'jobs.<job_id>.with.<with_id>' are github, needs, strategy, matrix, inputs and vars, so a
      # caller holding the ARN in an organisation secret has no way to pass it there and must send
      # it here instead. A caller holding it in an organisation variable can keep using the input.
      #
      # Where both are supplied the secret wins, on the grounds that the more specific of the two
      # is the one the caller went out of its way to provide.
      #
      # A caller using this secret must also set 'aws_oidc_role_from_secret', because the steps
      # that consume it cannot detect it on their own. 
      AWS_OIDC_ROLE_ARN:
        required: false

# Ensures that only one workflow runs at a time
concurrency: ${{ inputs.concurrency_group }}

jobs:
  terraform-lint:
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ${{ inputs.github_runner }}
    outputs:
      lint_status: ${{ steps.lint.outcome }}

    env:
      # the secrets context cannot be read from a step level if, so it is surfaced
      # here as a plain value that a step condition can test
      GH_APP_CONFIGURED: ${{ secrets.GH_APP_ID != '' && secrets.GH_APP_PRIVATE_KEY != '' }}
    steps:
      # Skipped rather than allowed to fail when no app is configured. continue-on-error
      # stops the failure but not the error annotation, so every run of a repository that
      # does not use private modules showed red errors on an otherwise green result, which
      # teaches people to ignore annotations.
      - name: Get Github Access Token
        id: github_app_token
        if: env.GH_APP_CONFIGURED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.MODULE_REPOS }}

      - name: Set Private Module Access Token
        if: env.GH_APP_CONFIGURED == 'true'
        run: |
          git config --global url."https://x-access-token:${{ steps.github_app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Ensure that the checkout action does not persist credentials to not override private module access
          persist-credentials: false

      - name: Get TFLint Config
        uses: terraform-linters/tflint-load-config-action@32d9f74138340b95873e956fbdfc390db819bff1 # v3
        if: ${{ inputs.tflint_repo_config_path != '' }}
        with:
          source-repo: ${{ inputs.tflint_repo }}
          source-path: ${{ inputs.tflint_repo_config_path }}
          source-ref: ${{ inputs.tflint_repo_ref }}
          destination-path: .tflint.hcl
          token: ${{ steps.github_app_token.outputs.token || secrets.GITHUB_TOKEN }}

      # tflint is run directly rather than through reviewdog/action-tflint.
      #
      # That action reports every diagnostic as a GitHub annotation, and GitHub caps
      # annotations at 10 warnings per step. reviewdog treats hitting the cap as a fatal
      # error and exits non-zero, which failed the job even when every diagnostic was an
      # info or a warning and fail_level was set to error. The effect was a size limit
      # rather than a severity gate: any module with more than ten diagnostics failed
      # linting no matter how trivial they were.
      #
      # Running tflint directly puts every finding in the run summary, where there is no
      # cap, and keeps annotations for the error severity findings that actually gate.
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ inputs.tflint_version }}
          github_token: ${{ steps.github_app_token.outputs.token || secrets.GITHUB_TOKEN }}
          cache: true

      - name: Run TFLint
        id: tflint_run
        working-directory: ${{ inputs.terraform_working_directory }}
        env:
          # tflint-load-config-action writes the shared config to the workspace root, which
          # is not necessarily the directory tflint runs in
          TFLINT_CONFIG: ${{ github.workspace }}/.tflint.hcl
          GITHUB_TOKEN: ${{ steps.github_app_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          ARGS=()
          if [ -f "${TFLINT_CONFIG}" ]; then
            ARGS+=("--config=${TFLINT_CONFIG}")
          fi

          # GitHub runs step scripts under "bash -e", so a non-zero exit here would abort
          # the step before the exit code could be recorded. tflint returns 2 when it finds
          # something, which is an expected outcome rather than a failure of this step, so
          # error handling is switched off for exactly the two calls whose codes are read.
          set +e
          tflint --init "${ARGS[@]}"
          INIT_CODE=$?

          # --minimum-failure-severity ties the exit code to error severity while the json
          # output still carries every diagnostic, so warnings stay visible in the summary
          # without deciding the outcome.
          tflint --format=json --minimum-failure-severity=error "${ARGS[@]}" \
            > "${RUNNER_TEMP}/tflint.json"
          RUN_CODE=$?
          set -e

          if [ "${INIT_CODE}" -ne 0 ]; then
            echo "::error::tflint --init failed with exit code ${INIT_CODE}"
            exit 1
          fi
          echo "exit_code=${RUN_CODE}" >> "$GITHUB_OUTPUT"

      # Reporting and the gate live here rather than in the step above, so that the summary
      # is written even when tflint found something that fails the job.
      - name: TFLint findings
        id: lint
        if: always() && steps.tflint_run.conclusion != 'skipped'
        env:
          TFLINT_EXIT: ${{ steps.tflint_run.outputs.exit_code }}
          ANNOTATIONS: ${{ runner.temp }}/tflint-annotations.txt
        run: |
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/tflint.json"
          : > "${ANNOTATIONS}"

          # An empty value means the step above aborted before recording anything, which is
          # a failure of the pipeline rather than a clean run. Treating it as "no findings"
          # would turn a broken lint step into a green check.
          if [ -z "${TFLINT_EXIT}" ]; then
            {
              echo "## TFLint"
              echo ""
              echo "TFLint did not report an exit code, so the run cannot be trusted."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::tflint did not record an exit code"
            exit 1
          fi

          if [ ! -s "${REPORT}" ]; then
            {
              echo "## TFLint"
              echo ""
              echo "No output was produced, so there is nothing to report."
            } >> "$GITHUB_STEP_SUMMARY"
            # exit code 1 means tflint itself failed rather than finding issues
            if [ "${TFLINT_EXIT}" = "1" ]; then
              echo "::error::tflint failed to run"
              exit 1
            fi
            exit 0
          fi
          python3 - "${REPORT}" >> "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import collections, json, os, sys

          data = json.load(open(sys.argv[1]))
          issues = data.get("issues") or []
          errors = data.get("errors") or []

          def sev(issue):
              return (issue.get("rule", {}).get("severity") or "unknown").lower()

          print("## TFLint")
          print()

          if errors:
              print("TFLint reported an internal error:")
              print()
              for e in errors:
                  print(f"- {e.get('message', e)}")
              print()

          if not issues:
              print("No findings.")
          else:
              counts = collections.Counter(sev(i) for i in issues)
              order = ["error", "warning", "notice", "info", "unknown"]
              shown = ", ".join(f"{counts[s]} {s}" for s in order if counts.get(s))
              print(f"{len(issues)} finding(s): {shown}. Only error severity fails this job.")
              print()
              print("| Severity | Rule | Location | Message |")
              print("|---|---|---|---|")
              for i in sorted(issues, key=lambda x: order.index(sev(x)) if sev(x) in order else 99):
                  rule = i.get("rule", {})
                  rng = i.get("range", {})
                  loc = f"{rng.get('filename','?')}:{(rng.get('start') or {}).get('line','?')}"
                  name, link = rule.get("name", "?"), rule.get("link")
                  label = f"[`{name}`]({link})" if link else f"`{name}`"
                  print(f"| {sev(i)} | {label} | `{loc}` | {i.get('message','')[:100]} |")

          # Annotations only for the severity that gates, and capped well under GitHub's
          # limit of ten per step. Everything else is in the table above.
          #
          # These are written to a file rather than printed, because this script's stdout is
          # redirected into the step summary, where a workflow command is inert text.
          err_issues = [i for i in issues if sev(i) == "error"]
          with open(os.environ["ANNOTATIONS"], "w") as fh:
              for i in err_issues[:8]:
                  rng = i.get("range", {})
                  start = rng.get("start") or {}
                  msg = i.get("message", "").replace("\n", " ")
                  fh.write(f"::error file={rng.get('filename','')},"
                           f"line={start.get('line', 1)}::"
                           f"{i.get('rule', {}).get('name', 'tflint')}: {msg}\n")
          PYEOF
          PY_CODE=$?
          if [ "${PY_CODE}" -ne 0 ]; then
            echo "::error::could not read the tflint report (parser exit ${PY_CODE})"
            exit 1
          fi

          cat "${ANNOTATIONS}"

          # tflint exits 1 on its own failure, 2 when it found issues at or above the
          # configured minimum failure severity
          if [ "${TFLINT_EXIT}" = "1" ]; then
            echo "::error::tflint failed to run"
            exit 1
          fi
          if [ "${TFLINT_EXIT}" = "2" ]; then
            echo "::error::tflint reported findings at error severity"
            exit 1
          fi

  terraform-execution:
    needs:
      - terraform-lint
    if: ${{ always() && !failure() && !cancelled() && inputs.enable_terraform_execution  }}
    runs-on: ${{ inputs.github_runner }}
    outputs:
      execution_status: ${{ steps.plan.outcome || steps.apply.outcome }}
      execution_type: ${{ steps.set_execution_type.outputs.type }}

    env:
      # the secrets context cannot be read from a step level if, so it is surfaced
      # here as a plain value that a step condition can test
      GH_APP_CONFIGURED: ${{ secrets.GH_APP_ID != '' && secrets.GH_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Get Private Module Access Token
        if: env.GH_APP_CONFIGURED == 'true'
        id: private_module_access
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # If owner is set and repositories is empty, access will be scoped to all repositories in the provided repository owner's installation
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.MODULE_REPOS }}

      - name: Set Private Module Access Token
        if: env.GH_APP_CONFIGURED == 'true'
        run: |
          git config --global url."https://x-access-token:${{ steps.private_module_access.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Ensure that the checkout action does not persist credentials to not override private module access
          persist-credentials: false

      - name: Setup Terraform
        if: ${{ inputs.use_opentofu == false }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false
          cli_config_credentials_hostname: ${{ inputs.terraform_registry_hostname }}
          cli_config_credentials_token: ${{ secrets.TERRAFORM_REGISTRY_TOKEN }}

      - name: Setup OpenTofu
        if: ${{ inputs.use_opentofu == true }}
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: ${{ inputs.terraform_version }}
          tofu_wrapper: false
          cli_config_credentials_hostname: ${{ inputs.terraform_registry_hostname }}
          cli_config_credentials_token: ${{ secrets.TERRAFORM_REGISTRY_TOKEN }}

      - name: Determine Execution Type
        id: set_execution_type
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "type=plan" >> $GITHUB_OUTPUT
            echo "::notice::Will run Terraform Plan for pull request"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/${{ inputs.default_branch }}" ]]; then
            if [[ "${{ inputs.apply_requires_dispatch }}" == "true" ]]; then
              # apply_requires_dispatch is on, so the merge only shows what would happen.
              # Start this workflow by hand on ${{ inputs.default_branch }} to apply it.
              echo "type=plan" >> $GITHUB_OUTPUT
              echo "::notice::Will run Terraform Plan for push to ${{ inputs.default_branch }} - apply_requires_dispatch is set, so run this workflow manually on ${{ inputs.default_branch }} to apply"
            else
              echo "type=apply" >> $GITHUB_OUTPUT
              echo "::notice::Will run Terraform Apply for push to ${{ inputs.default_branch }}"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.apply_requires_dispatch }}" == "true" && "${{ github.ref }}" == "refs/heads/${{ inputs.default_branch }}" ]]; then
            # The branch is checked so a manual run on a feature branch cannot apply it.
            echo "type=apply" >> $GITHUB_OUTPUT
            echo "::notice::Will run Terraform Apply for manual run on ${{ inputs.default_branch }}"
          else
            echo "type=skip" >> $GITHUB_OUTPUT
            echo "::notice::Skipping Terraform execution - not a PR or push to ${{ inputs.default_branch }}"
          fi

      - name: "Configure AWS credentials"
        if: ${{ inputs.aws_oidc_role_arn != '' || inputs.aws_oidc_role_from_secret }}
        uses: isceco/github-workflows/.github/actions/aws/configure_credentials@v1
        with:
          AWS_ROLE_ARN_TO_ASSUME: ${{ secrets.AWS_OIDC_ROLE_ARN || inputs.aws_oidc_role_arn }}
          AWS_REGION: ${{ inputs.aws_default_region }}
          AWS_SESSION_NAME: GitHubActions-${{ github.run_id }}
          AWS_SESSION_DURATION: ${{ inputs.aws_oidc_role_duration_seconds }}

      - name: Setup ECR Authentication for OCI Modules EXEC
        if: ${{ inputs.enable_ecr_oci_modules && inputs.ecr_oci_registry_ids != '' }}
        env:
          ECR_REGISTRY_IDS: ${{ inputs.ecr_oci_registry_ids }}
          AWS_DEFAULT_REGION_INPUT: ${{ inputs.aws_default_region }}
        run: |
          set -euo pipefail
          mkdir -p ~/.docker
          AUTHS='{}'
          IFS=',' read -ra REGISTRY_IDS <<< "${ECR_REGISTRY_IDS}"
          for registry_id in "${REGISTRY_IDS[@]}"; do
            registry_id="$(echo "${registry_id}" | xargs)"
            [ -n "${registry_id}" ] || continue
            ECR_TOKEN="$(aws ecr get-login-password --region "${AWS_DEFAULT_REGION_INPUT}")"
            ECR_REGISTRY="${registry_id}.dkr.ecr.${AWS_DEFAULT_REGION_INPUT}.amazonaws.com"
            AUTH="$(printf 'AWS:%s' "${ECR_TOKEN}" | base64 -w 0)"
            AUTHS="$(jq -c --arg reg "${ECR_REGISTRY}" --arg auth "${AUTH}" \
              '.[$reg] = {auth: $auth}' <<< "${AUTHS}")"
          done
          jq -n --argjson auths "${AUTHS}" '{auths: $auths}' > ~/.docker/config.json


      - name: Terraform Init
        if: ${{ steps.set_execution_type.outputs.type != 'skip' }}
        id: init
        run: |
          if [[ "${{ inputs.use_opentofu }}" == "true" ]]; then
            tofu init
          else
            terraform init
          fi
        working-directory: ${{ inputs.terraform_working_directory }}

      - name: Terraform Plan
        if: ${{ steps.set_execution_type.outputs.type == 'plan' }}
        id: plan
        run: |
          if [[ "${{ inputs.use_opentofu }}" == "true" ]]; then
            tofu plan -no-color -input=false
          else
            terraform plan -no-color -input=false
          fi
        working-directory: ${{ inputs.terraform_working_directory }}
        continue-on-error: true

      - name: Terraform Plan Summary
        if: ${{ steps.set_execution_type.outputs.type == 'plan' }}
        run: |
          echo '### TERRAFORM PLAN SUMMARY :memo:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '**Status:** `${{ steps.plan.outcome }}`' >> $GITHUB_STEP_SUMMARY
          echo '**Triggered by:** @${{ github.actor }}' >> $GITHUB_STEP_SUMMARY
          echo '**Action:** `${{ github.event_name }}`' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '<details><summary>Show Plan Output</summary>' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.plan.outputs.stdout }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY

      - name: Terraform Plan Status
        if: ${{ steps.set_execution_type.outputs.type == 'plan' && steps.plan.outcome == 'failure' }}
        run: exit 1

      - name: Terraform Apply
        if: ${{ steps.set_execution_type.outputs.type == 'apply' }}
        id: apply
        run: |
          if [[ "${{ inputs.use_opentofu }}" == "true" ]]; then
            tofu apply -auto-approve -no-color -input=false
          else
            terraform apply -auto-approve -no-color -input=false
          fi
        working-directory: ${{ inputs.terraform_working_directory }}

      - name: Terraform Apply Summary
        if: ${{ steps.set_execution_type.outputs.type == 'apply' }}
        run: |
          echo '### TERRAFORM APPLY SUMMARY :rocket:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '**Status:** `${{ steps.apply.outcome }}`' >> $GITHUB_STEP_SUMMARY
          echo '**Triggered by:** @${{ github.actor }}' >> $GITHUB_STEP_SUMMARY
          echo '**Action:** `${{ github.event_name }}`' >> $GITHUB_STEP_SUMMARY
          echo '**Branch:** `${{ github.ref }}`' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '<details><summary>Show Apply Output</summary>' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.apply.outputs.stdout }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY

  workflow-summary:
    needs:
      - terraform-lint
      - terraform-execution
    runs-on: ${{ inputs.github_runner }}
    if: ${{ always() }}

    steps:
      - name: Workflow Summary
        env:
          TERRAFORM_VERSION: ${{ inputs.terraform_version }}
          TF_LINT_RESULT: ${{ needs.terraform-lint.result == 'skipped' && ':heavy_minus_sign:' || needs.terraform-lint.outputs.lint_status == 'success' && ':white_check_mark:' || ':x:' }}
          # a repository with no test files reports a dash rather than a tick, so the
          # summary does not imply tests passed when none exist
          TF_EXECUTION_RESULT: ${{ needs.terraform-execution.result == 'skipped' && ':heavy_minus_sign:' || needs.terraform-execution.outputs.execution_status == 'success' && ':white_check_mark:' || ':x:' }}
          TF_EXECUTION_TYPE: ${{ needs.terraform-execution.outputs.execution_type }}
        run: |
          echo '### WORKFLOW SUMMARY :octocat:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '| result | job |' >> $GITHUB_STEP_SUMMARY
          echo '|---|---|' >> $GITHUB_STEP_SUMMARY
          echo '| ${{ env.TF_LINT_RESULT }} | terraform lint |' >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.enable_terraform_execution }}" == "true" && "${{ env.TF_EXECUTION_TYPE }}" != "skip" ]]; then
            echo '| ${{ env.TF_EXECUTION_RESULT }} | terraform ${{ env.TF_EXECUTION_TYPE }} |' >> $GITHUB_STEP_SUMMARY
          fi
